<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightglass — Live</title>
<!-- Maquette de direction artistique, jetable : la vraie app est en SwiftUI (voir DESIGN.md). -->
<style>
:root{
  --ink:#05010f;--night:#1a0433;--mag:#ff2a6d;--cyan:#05d9e8;--acid:#f9f002;
  --text:#f3eeff;--dim:rgba(243,238,255,.55);
  --cond:"Avenir Next Condensed","Bahnschrift Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--cond)}
#scene,#glass{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{z-index:0}
#glass{z-index:3;pointer-events:none}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:#cfd6ff;mix-blend-mode:screen;opacity:0}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
body.full::after,body.full #glass,body.full #flash{display:none}

#app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.chroma{text-shadow:-2px 0 rgba(255,42,109,.9),2px 0 rgba(5,217,232,.85),0 0 22px rgba(255,42,109,.45),0 0 70px rgba(255,42,109,.2)}
.mono{font-family:var(--mono)}

/* header */
header{display:flex;align-items:center;gap:34px;padding:18px 28px 4px}
.logo h1{margin:0;font-size:42px;font-weight:800;letter-spacing:.05em;line-height:.9}
.logo small{display:block;white-space:nowrap;font:500 10px/1.6 var(--mono);letter-spacing:.32em;color:var(--cyan);margin-top:6px}
.logo small b{color:var(--mag);font-weight:500}
nav{display:flex;gap:4px}
nav button{all:unset;cursor:pointer;position:relative;padding:8px 14px;font-weight:700;font-size:19px;letter-spacing:.14em;color:var(--dim);transition:color .2s}
nav button:hover{color:var(--text)}
nav button.on{color:#fff;text-shadow:-1.5px 0 rgba(255,42,109,.9),1.5px 0 rgba(5,217,232,.85),0 0 18px rgba(255,42,109,.5)}
nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:var(--mag);box-shadow:0 0 8px var(--mag),0 0 18px var(--mag)}
nav kbd{font:9px var(--mono);color:rgba(5,217,232,.5);margin-left:6px;vertical-align:middle}
.search{flex:1;max-width:360px;display:flex;align-items:center;gap:10px;font:11px var(--mono);letter-spacing:.2em;color:var(--dim);border:1px solid rgba(5,217,232,.25);padding:10px 12px;background:rgba(5,1,15,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:text}
.search .p{color:var(--cyan);animation:blink 1s steps(1) infinite}
.search kbd{margin-left:auto;font:10px var(--mono);color:var(--acid);border:1px solid rgba(249,240,2,.4);padding:2px 6px}
@keyframes blink{50%{opacity:0}}
.hud{margin-left:auto;display:flex;gap:16px;align-items:center;font:11px var(--mono);letter-spacing:.2em;color:var(--dim)}
.hud .clock{color:var(--text);font-size:13px}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:-2px;margin-left:6px}
.sig i{width:3px;background:var(--cyan);box-shadow:0 0 4px var(--cyan)}
.sig i:nth-child(1){height:20%}.sig i:nth-child(2){height:40%}.sig i:nth-child(3){height:60%}.sig i:nth-child(4){height:80%}.sig i:nth-child(5){height:100%}
.sig i.off{opacity:.18;box-shadow:none}
.sig.bad i{background:var(--mag);box-shadow:0 0 4px var(--mag)}
.tog{all:unset;cursor:pointer;font:600 11px var(--mono);letter-spacing:.2em;padding:8px 12px;border:1px solid rgba(5,217,232,.35);color:var(--text);background:rgba(5,1,15,.55);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.tog b{color:var(--cyan);font-weight:600}
.tog.hot{border-color:rgba(255,42,109,.6)}
.tog.hot b{color:var(--mag)}

/* main */
main{display:grid;grid-template-columns:minmax(420px,1fr) minmax(460px,1.3fr);gap:32px;padding:6px 28px 16px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0}
.signs{display:flex;gap:12px;align-items:flex-start;height:218px;padding:0 4px;overflow:hidden;flex:none}
.sign{--c:var(--mag);all:unset;cursor:pointer;position:relative;display:flex;gap:4px;padding:10px 7px 12px;border:2px solid var(--c);border-radius:7px;background:rgba(5,1,15,.6);
  box-shadow:0 0 6px var(--c),0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 35%,transparent);
  opacity:.5;transition:opacity .25s,transform .4s cubic-bezier(.3,1.5,.5,1),filter .25s;filter:saturate(.7)}
.sign::before{content:"";position:absolute;bottom:100%;left:50%;width:1px;height:300px;background:linear-gradient(transparent,rgba(243,238,255,.3))}
.sign span{writing-mode:vertical-rl;text-orientation:upright}
.sign .w{font-weight:800;font-size:17px;letter-spacing:-.02em;color:#fff;text-shadow:0 0 3px var(--c),0 0 10px var(--c),0 0 24px var(--c)}
.sign .jp{font:600 10px "Hiragino Sans",sans-serif;color:var(--c);opacity:.85;text-shadow:0 0 6px var(--c)}
.sign:hover{opacity:.9;filter:none;animation:flick .55s steps(1) 1}
.sign.on{opacity:1;filter:none;transform:translateY(8px)}
.sign:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
@keyframes flick{0%{opacity:1}7%{opacity:.15}11%{opacity:1}24%{opacity:.35}27%{opacity:1}}

.panel{position:relative;background:rgba(5,1,15,.64);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(5,217,232,.22);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cap{display:flex;justify-content:space-between;font:10px var(--mono);letter-spacing:.3em;color:var(--cyan);padding:11px 16px;border-bottom:1px solid rgba(5,217,232,.14)}
.cap b{color:var(--mag);font-weight:500}
.list{flex:1;min-height:0;display:flex;flex-direction:column}
.rows{flex:1;overflow:auto;scrollbar-width:none;padding:4px 0}
.rows::-webkit-scrollbar{display:none}
.row{--c:var(--cyan);display:grid;grid-template-columns:38px 42px 1fr auto;gap:14px;align-items:center;padding:9px 16px;cursor:pointer;position:relative}
.row .n{font:12px var(--mono);color:rgba(5,217,232,.6)}
.row .lg{width:42px;height:42px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.02em;color:#fff;border:1.5px solid var(--c);border-radius:7px;background:rgba(5,1,15,.7);
  text-shadow:0 0 8px var(--c);box-shadow:inset 0 0 12px color-mix(in srgb,var(--c) 40%,transparent),0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.row .t{min-width:0}
.row .t b{display:block;font-size:19px;font-weight:700;letter-spacing:.05em;line-height:1.1}
.row .t span{display:block;font:11px var(--mono);letter-spacing:.06em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .bar{height:2px;background:rgba(243,238,255,.1);margin-top:7px}
.row .bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 6px var(--c)}
.row .q{font:10px var(--mono);letter-spacing:.15em;color:var(--acid);border:1px solid rgba(249,240,2,.45);padding:2px 6px}
.row:hover{background:linear-gradient(90deg,rgba(5,217,232,.09),transparent 80%)}
.row:hover .lg{animation:flick .5s steps(1) 1}
.row.on{background:linear-gradient(90deg,rgba(255,42,109,.24),rgba(255,42,109,.02) 75%)}
.row.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--mag);box-shadow:0 0 10px var(--mag),0 0 22px var(--mag)}
.row.on .t b{text-shadow:-1.5px 0 rgba(255,42,109,.9),1.5px 0 rgba(5,217,232,.85),0 0 16px rgba(255,42,109,.5)}
.row.on .n{color:var(--mag)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;border-top:1px solid rgba(5,217,232,.14);font:10px var(--mono);letter-spacing:.16em;color:var(--dim)}
.keys kbd{font:10px var(--mono);color:var(--ink);background:rgba(243,238,255,.85);padding:1px 5px;margin-right:5px}

.right{display:flex;flex-direction:column;align-items:flex-end;min-height:0}
.pv{position:relative;width:100%;max-width:calc(46vh * 16 / 9);aspect-ratio:16/9;flex:none;background:#000;border:1px solid rgba(5,217,232,.5);cursor:pointer;
  box-shadow:0 0 40px rgba(5,217,232,.16),0 30px 90px rgba(255,42,109,.16);
  -webkit-box-reflect:below 4px linear-gradient(transparent 68%,rgba(255,255,255,.32))}
.pv canvas{position:absolute;inset:0;width:100%;height:100%}
.pv::before,.pv::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--mag);z-index:2;pointer-events:none;filter:drop-shadow(0 0 6px var(--mag))}
.pv::before{top:-7px;left:-7px;border-right:0;border-bottom:0}
.pv::after{bottom:-7px;right:-7px;border-left:0;border-top:0}
.numosd{position:absolute;top:8%;right:5%;z-index:3;font-weight:800;font-size:clamp(48px,9vh,110px);letter-spacing:.06em;opacity:0;transition:opacity .15s;pointer-events:none}
.numosd.show{opacity:1}
.osd{position:absolute;left:0;right:0;z-index:3;display:none;align-items:center;gap:24px;padding:22px 34px;font:12px var(--mono);letter-spacing:.2em;transition:opacity .4s}
.osd.top{top:0;background:linear-gradient(rgba(5,1,15,.85),transparent)}
.osd.bot{bottom:0;background:linear-gradient(transparent,rgba(5,1,15,.9));align-items:flex-end}
.osd .big{font:800 34px var(--cond);letter-spacing:.06em}
.pv.full{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;aspect-ratio:auto;z-index:20;border:0;box-shadow:none;-webkit-box-reflect:none;cursor:default}
.pv.full::before,.pv.full::after{display:none}
.pv.full .osd{display:flex}
.pv.full.idle .osd{opacity:0}
.pv.full.idle{cursor:none}
.np{width:100%;max-width:calc(46vh * 16 / 9);margin-top:calc(46vh * .3)}
.np .body{display:grid;grid-template-columns:1.6fr 1fr;gap:0}
.np .now,.np .next{padding:14px 18px}
.np .next{border-left:1px solid rgba(5,217,232,.14)}
.lab{font:10px var(--mono);letter-spacing:.28em;color:var(--acid)}
.lab.c{color:var(--cyan)}
.np h2{margin:6px 0 4px;font-size:30px;font-weight:800;letter-spacing:.04em;line-height:1}
.np h3{margin:6px 0 4px;font-size:20px;font-weight:700;letter-spacing:.05em;color:var(--dim)}
.np p{margin:6px 0 10px;font:12px/1.5 var(--mono);color:var(--dim)}
.prog{height:3px;background:rgba(243,238,255,.12)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 8px var(--mag)}
.tech{display:flex;gap:16px;align-items:center;padding:10px 18px;border-top:1px solid rgba(5,217,232,.14);font:10px var(--mono);letter-spacing:.2em;color:var(--dim)}
.tech b{color:var(--text);font-weight:500}

footer{display:flex;height:34px;border-top:1px solid rgba(255,42,109,.4);background:rgba(5,1,15,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:12px var(--mono);letter-spacing:.14em}
.wtag{background:var(--mag);color:var(--ink);padding:0 16px;display:flex;align-items:center;font-weight:700;flex:none;box-shadow:0 0 20px var(--mag)}
.wire{flex:1;overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.wire div{display:inline-block;animation:wire 90s linear infinite;padding-left:24px}
.wire span{cursor:pointer;margin-right:34px}
.wire span:hover{color:#fff}
.wire em{font-style:normal;color:var(--acid);margin-right:34px}
@keyframes wire{to{transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  .sign:hover,.row:hover .lg{animation:none}
  .wire div{animation-duration:400s}
  .search .p{animation:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app">
  <header>
    <div class="logo">
      <h1 class="chroma">NIGHTGLASS</h1>
      <small>DISTRICT 9 · <b>LIVE</b> · <span id="count"></span> CHANNELS</small>
    </div>
    <nav>
      <button class="on">LIVE<kbd>⌘1</kbd></button><button>GUIDE<kbd>⌘2</kbd></button><button>MOVIES<kbd>⌘3</kbd></button><button>SERIES<kbd>⌘4</kbd></button>
    </nav>
    <div class="search"><span class="p">&gt;</span>SEARCH THE CITY<kbd>⌘K</kbd></div>
    <div class="hud">
      <span class="clock" id="clock">--:--:--</span>
      <span>SIGNAL<span class="sig" id="sig1"><i></i><i></i><i></i><i></i><i></i></span></span>
      <button class="tog" id="rainBtn">RAIN <b>DOWNPOUR</b></button>
      <button class="tog" id="soundBtn">SOUND <b>OFF</b></button>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="signs" id="signs"></div>
      <div class="panel list">
        <div class="cap"><span>// CHANNELS · <b id="catName">ALL</b></span><span id="catCount"></span></div>
        <div class="rows" id="rows"></div>
        <div class="keys">
          <span><kbd>↑↓</kbd>CHANNEL</span><span><kbd>←→</kbd>DISTRICT</span><span><kbd>↵</kbd>WATCH</span><span><kbd>0-9</kbd>DIAL</span><span><kbd>R</kbd>RAIN</span><span><kbd>M</kbd>SOUND</span><span><kbd>⇧␣</kbd>STRIKE</span>
        </div>
      </div>
    </section>

    <section class="right">
      <div class="pv" id="pv" title="Double-clic ou ↵ pour le plein écran">
        <canvas id="bc"></canvas>
        <div class="numosd chroma" id="numosd"></div>
        <div class="osd top"><span class="big chroma" id="oNum"></span><span class="big" id="oName"></span><span style="margin-left:auto" id="oClock"></span><span>SIGNAL<span class="sig" id="sig2"><i></i><i></i><i></i><i></i><i></i></span></span></div>
        <div class="osd bot"><div><div class="lab">● NOW</div><div class="big" id="oNow"></div></div><div style="margin-left:auto;text-align:right"><div class="lab c">NEXT</div><div id="oNext" style="font-size:16px;margin-top:6px"></div></div><span>ESC</span></div>
      </div>
      <div class="panel np">
        <div class="body">
          <div class="now">
            <div class="lab">● NOW · <span id="nowTime"></span></div>
            <h2 class="chroma" id="nowTitle"></h2>
            <p id="nowDesc"></p>
            <div class="prog"><i id="nowProg"></i></div>
          </div>
          <div class="next">
            <div class="lab c">NEXT · <span id="nextTime"></span></div>
            <h3 id="nextTitle"></h3>
            <p id="left"></p>
          </div>
        </div>
        <div class="tech"><span>CH <b id="tNum"></b></span><span><b id="tQ"></b> · H.264 · AAC 5.1</span><span><b id="tRate"></b> MB/S</span><span>BUFFER <b id="tBuf"></b>S</span><span style="margin-left:auto">LINK<span class="sig" id="sig3"><i></i><i></i><i></i><i></i><i></i></span></span></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wtag">● NG WIRE</div>
    <div class="wire"><div id="wire"></div></div>
  </footer>
</div>
<canvas id="glass"></canvas>
<div id="flash"></div>

<script>
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = {mag:'#ff2a6d', cyan:'#05d9e8', acid:'#f9f002'};
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const hhmm = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

// ---------- données fictives ----------
const CATS = [['ALL','オール','cyan'],['CINEMA','シネマ','mag'],['SPORTS','スポーツ','acid'],['NEWS','ニュース','cyan'],['MUSIC','ミュージック','mag'],['KIDS','キッズ','acid'],['DOCS','ドキュ','cyan'],['NIGHT','ナイト','mag']];
const DESC = {
  CINEMA:'Un détective fatigué, une ville qui ne sèche jamais. Version restaurée 4K.',
  SPORTS:'En direct du Harbour Dome. Commentaires : K. Ito & M. Diallo.',
  NEWS:'Le point sur la nuit : coupures sur la ligne 4, marchés, météo des néons.',
  MUSIC:'Deux heures de synthés analogiques, en direct du toit de la Tower 6.',
  KIDS:'Pixel et Boulon cherchent la batterie perdue de la grande roue.',
  DOCS:'À 4 000 mètres sous la surface, la vie fabrique sa propre lumière.',
  NIGHT:'Talk-show de minuit. Ce soir : les vendeurs de ramen du marché.',
  ALL:'Le direct qui ne dort jamais : infos, invités, et la ville en fond.'
};
const MIN = 60000, T0 = Date.now();
const CH = [
  [1,'NEON ONE','ALL','cyan','4K',195,'LE GRAND DIRECT','MÉTÉO DES NÉONS'],
  [2,'KANAL 9','ALL','mag','HD',320,'ON REFAIT LA NUIT','LE 23H'],
  [3,'ORBIT SPORT 1','SPORTS','acid','4K',140,'DISTRICT CUP · FINALE','LE MAG DU FOOT'],
  [4,'ORBIT SPORT 2','SPORTS','cyan','HD',100,'NIGHT RACE · GP DE TOKYO','PADDOCK'],
  [5,'CINÉ NOIR','CINEMA','mag','4K',350,'BLADE OF THE RAIN','LA NUIT DU CHASSEUR'],
  [6,'CINEMAX 404','CINEMA','acid','FHD',270,'GHOST SIGNAL','REWIND 1984'],
  [7,'WIRE 24','NEWS','mag','HD',0,'ÉDITION DE LA NUIT','LE JOURNAL DU MONDE'],
  [8,'SKYLINE NEWS','NEWS','cyan','HD',210,'BREAKING · LIGNE 4','DÉBAT'],
  [9,'SYNTHWAVE FM','MUSIC','mag','FHD',300,'MIDNIGHT DRIVE MIX','CHROME HEARTS LIVE'],
  [10,'BASS DISTRICT','MUSIC','cyan','HD',250,'SUBWAY SESSIONS','B2B ALL NIGHT'],
  [11,'PIXEL KIDS','KIDS','acid','HD',50,'ROBOTS EN PYJAMA','CAPITAINE BOULON'],
  [12,'DEEP FIELD','DOCS','cyan','4K',220,'LES ABYSSES','LA VILLE VUE DU CIEL'],
  [13,'MOTHERSHIP','DOCS','mag','FHD',280,'ARCHIVES DU FUTUR','ROBOTS DE GUERRE'],
  [14,'AFTERHOURS','NIGHT','acid','HD',330,'LE ZINC DE MINUIT','PLAYLIST NOCTURNE'],
].map(([n,name,cat,col,q,hue,now,next], i) => {
  const start = T0 - ((i * 7 + 13) % 40) * MIN, end = start + (45 + (i * 17) % 60) * MIN;
  return {n, name, cat, col, q, hue, now, next, start, end};
});

// ---------- état + UI ----------
let cat = 0, list = CH, sel = 0, cur = CH[0], glitchUntil = 0;
$('#count').textContent = (2431).toLocaleString('fr-FR');
const signTops = [0, 30, 8, 44, 16, 36, 4, 24];
$('#signs').innerHTML = CATS.map(([w, jp, c], i) =>
  `<button class="sign" data-i="${i}" style="--c:${COL[c]};margin-top:${signTops[i]}px"><span class="w">${w}</span><span class="jp">${jp}</span></button>`).join('');
$('#signs').addEventListener('click', e => { const b = e.target.closest('.sign'); if (b) setCat(+b.dataset.i); });
$('#signs').addEventListener('mouseover', e => { if (e.target.closest('.sign') && !e.target.closest('.sign').contains(e.relatedTarget)) buzz(); });

function setCat(i) {
  cat = (i + CATS.length) % CATS.length;
  const name = CATS[cat][0];
  list = name === 'ALL' ? CH : CH.filter(c => c.cat === name);
  document.querySelectorAll('.sign').forEach((s, k) => s.classList.toggle('on', k === cat));
  $('#catName').textContent = name;
  $('#catCount').textContent = String(list.length).padStart(3, '0') + ' LIVE';
  $('#rows').innerHTML = list.map((c, i) =>
    `<div class="row" data-i="${i}" style="--c:${COL[c.col]}"><span class="n">${String(c.n).padStart(3,'0')}</span>` +
    `<span class="lg">${c.name.split(' ').map(w => w[0]).join('').slice(0,2)}</span>` +
    `<span class="t"><b>${c.name}</b><span>${c.now}</span><div class="bar"><i></i></div></span><span class="q">${c.q}</span></div>`).join('');
  const k = list.indexOf(cur);
  sel = k < 0 ? 0 : k;
  markRow(); updateBars();
}
function markRow() {
  document.querySelectorAll('.row').forEach((r, k) => r.classList.toggle('on', k === sel));
  document.querySelector('.row.on')?.scrollIntoView({block:'nearest'});
}
function select(i) {
  if (!list.length) return;
  sel = (i + list.length) % list.length;
  markRow();
  if (list[sel] !== cur) tune(list[sel]);
}
function tune(c) {
  cur = c; glitchUntil = performance.now() + (reduce ? 0 : 190);
  tick(); fillNow();
}
function fillNow() {
  const c = cur, p = Math.min(1, (Date.now() - c.start) / (c.end - c.start));
  $('#nowTime').textContent = `${hhmm(c.start)}–${hhmm(c.end)}`;
  $('#nowTitle').textContent = c.now;
  $('#nowDesc').textContent = DESC[c.cat];
  $('#nowProg').style.width = (p * 100).toFixed(1) + '%';
  $('#nextTime').textContent = hhmm(c.end);
  $('#nextTitle').textContent = c.next;
  $('#left').textContent = `DANS ${Math.max(1, Math.round((c.end - Date.now()) / MIN))} MIN`;

// pluie : pools fixes, rien n'est alloué pendant l'animation
const MAXD = 1400, D = new Float32Array(MAXD * 4);

let lvl = 2;

  D[i*4] = rand(-100, W + 60); D[i*4+1] = anyY ? rand(-20, H) : rand(-120, -10);
  D[i*4+2] = z; D[i*4+3] = rand(10, 16) * z * 1.5;
}

  $('#rainBtn').innerHTML = `RAIN <b>${LEVELS[lvl][0]}</b>`;
  if (rainGain) rainGain.gain.setTargetAtTime([.04, .08, .14][lvl], AC.currentTime, .3);

function splash(x, y, z) {
  for (let k = 0; k < 2; k++) {
    const j = sHead * 5; sHead = (sHead + 1) % MAXS;
    S[j] = x; S[j+1] = y; S[j+2] = rand(-1.4, 1.4) * z; S[j+3] = rand(-2.6, -1) * z; S[j+4] = 1;
  }
}

let last = performance.now();
function drawScene(t, dt) {
  camX += ((reduce ? .5 : mx) - .5 - camX) * .05 * dt;
  camY += ((reduce ? .5 : my) - .5 - camY) * .05 * dt;
  // ciel
  const sky = ug.createLinearGradient(0, 0, 0, HZ);
  sky.addColorStop(0, '#05010f'); sky.addColorStop(.6, '#1a0433'); sky.addColorStop(1, '#3d0c4f');
  ug.fillStyle = sky; ug.fillRect(0, 0, W, HZ);
  if (flash > .02) { ug.fillStyle = `rgba(190,185,255,${flash * .85})`; ug.fillRect(0, 0, W, HZ); }
  if (bolt && flash > .5) {

    ug.beginPath(); bolt.forEach(([x, y], k) => k ? ug.lineTo(x, y) : ug.moveTo(x, y)); ug.stroke(); ug.restore();
  }
  // fenêtres qui s'allument / s'éteignent
  for (let k = 0; k < 3; k++) { const L = pick(layers); litWin(L.x, pick(L.wins), Math.random() < .45); }
  layers.forEach((L, i) => {
    const ox = -MARGIN - camX * PAR[i] * 2, oy = -camY * PAR[i] * .25;
    ug.drawImage(L.c, ox, oy + PAR[i] * .25, L.lw, HZ);
    signs.forEach(s => { if (s.L === i) drawSign(ug, s, ox, t); });
    if (i < 3) { ug.fillStyle = 'rgba(40,8,72,.16)'; ug.fillRect(0, 0, W, HZ); }
  });

  g.drawImage(up, 0, 0, W * DPR, HZ * DPR, 0, 0, W, HZ);

  // sol mouillé : reflet en miroir, ondulé

  const street = g.createLinearGradient(0, HZ, 0, H);
  street.addColorStop(0, '#12042a'); street.addColorStop(1, '#05010f');
  g.fillStyle = street; g.fillRect(0, HZ, W, SH);

}

    b.fillStyle = '#fff'; b.font = `800 ${18 * u}px "Avenir Next Condensed",sans-serif`; b.fillText('BREAKING', 12 * u, h * .74 + 22 * u);
    b.fillStyle = 'rgba(5,1,15,.9)'; b.fillRect(w * .28, h * .74, w * .72, 30 * u);
    b.fillStyle = '#f3eeff'; b.font = `600 ${14 * u}px Menlo,monospace`;
    b.fillText('LIGNE 4 · TRAFIC INTERROMPU ENTRE HARBOUR GATE ET TOWER 6', w * .28 + 12 * u - (t * .05) % (w * .9), h * .74 + 20 * u);
  }
  // habillage antenne
  b.fillStyle = 'rgba(5,1,15,.7)'; b.fillRect(w - 120 * u, 14 * u, 106 * u, 24 * u);
  b.fillStyle = '#fff'; b.font = `800 ${15 * u}px "Avenir Next Condensed",sans-serif`; b.textAlign = 'right';
  b.fillText(c.name, w - 22 * u, 31 * u); b.textAlign = 'left';
  b.fillStyle = Math.sin(t * .006) > 0 ? '#ff2a6d' : '#7a1434';
  b.beginPath(); b.arc(24 * u, 26 * u, 5 * u, 0, 7); b.fill();
  b.fillStyle = '#fff'; b.font = `600 ${12 * u}px Menlo,monospace`; b.fillText('LIVE', 36 * u, 30 * u);

  // glitch CRT au zapping
  if (t < glitchUntil) {
    const px = nzd.data;
    for (let i = 0; i < px.length; i += 4) { const v = Math.random() * 255; px[i] = px[i+1] = px[i+2] = v; px[i+3] = 255; }
    nzx.putImageData(nzd, 0, 0);
    for (let k = 0; k < 9; k++) {
      const sy = rand(0, h), sh = rand(3, 28);
      b.drawImage(bc, 0, sy * DPR, w * DPR, sh * DPR, rand(-40, 40), sy, w, sh);
    }
    b.globalAlpha = .55; b.imageSmoothingEnabled = false; b.drawImage(nz, 0, 0, w, h); b.imageSmoothingEnabled = true;
    b.globalCompositeOperation = 'lighter'; b.globalAlpha = .35;
    b.fillStyle = '#ff2a6d'; b.fillRect(rand(0, w), 0, rand(10, 60), h);
    b.fillStyle = '#05d9e8'; b.fillRect(rand(0, w), 0, rand(10, 60), h);
    b.globalCompositeOperation = 'source-over'; b.globalAlpha = 1;
  }
}

function frame(t) {
  const dt = Math.min(3, (t - last) / 16.667); last = t;
  if (!full) { drawScene(t, dt); drawGlass(dt); }
  drawBroadcast(t);
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
for (let i = 0; i < MAXD; i++) resetDrop(i, true);
setCat(0); fillNow();
requestAnimationFrame(frame);
</script>
