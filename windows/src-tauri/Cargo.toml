[package]
name = "nightglass"
version = "0.1.0"
description = "Nightglass IPTV player for Windows"
authors = ["MarcDownHQ"]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "nightglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
libloading = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
nightglass-core = { version = "0.1.0", path = "../core" }
url = { version = "2.5.8", features = ["serde"] }
