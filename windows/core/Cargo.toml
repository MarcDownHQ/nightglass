[package]
name = "nightglass-core"
version = "0.1.0"
description = "IPTV clients without UI: M3U, Xtream Codes, Stalker, XMLTV, and their common models"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[dependencies]
flate2 = "1.1.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

# Android has no system OpenSSL: build one from source with the NDK.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-vendored"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
