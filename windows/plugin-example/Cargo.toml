[package]
name = "nightglass-plugin-example"
version = "0.1.0"
description = "A Nightglass source provider plugin: channels from a JSON list"
edition = "2024"
license = "MIT"
publish = false

# Built on its own, for wasm32-wasip2: cargo build --release --target wasm32-wasip2
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
