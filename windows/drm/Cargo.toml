[package]
name = "nightglass-drm"
version = "0.1.0"
description = "Protected fMP4 without the network: the CDM helper's protocol, CENC boxes, and the decryption that turns them clear"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[features]
default = ["client"]
client = ["dep:tokio", "dep:log", "dep:libc"]
testing = []

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
log = { version = "0.4", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
