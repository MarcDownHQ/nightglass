# Checks and builds the Linux app (.deb and .rpm). Releases (a `v*` tag) run it from release.yml.
name: Linux

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/linux.yml']
  push:
    branches: [master]
    paths: ['windows/**', '.github/workflows/linux.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config gnome-keyring dbus cmake libclang-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The plugin host's tests build plugin-example as a WebAssembly component.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path plugin-example/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - run: dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test --workspace'
      # With the update key (not on forks), the packages are also signed for the in-app updater (.sig).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          else npm run tauri build; fi
      # The CDM helper ships next to the app, where it looks for it.
      - name: Check the CDM helper is packaged
        run: |
          dpkg-deb -c target/release/bundle/deb/*.deb | grep -qE '[ /]usr/bin/nightglass-widevine$'
      - uses: actions/upload-artifact@v7
        with:
          name: nightglass-linux
          path: |
            windows/target/release/bundle/deb/*.deb*
            windows/target/release/bundle/rpm/*.rpm*
