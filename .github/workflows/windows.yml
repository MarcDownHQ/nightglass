# Checks and builds the Windows app. A `windows-v*` tag also attaches the installer to a draft release,
# which stays private until someone publishes it on GitHub.
name: Windows

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [master]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci
      - run: npm run check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run fetch-libmpv
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nightglass-windows-installer
          path: windows/target/release/bundle/nsis/*.exe
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-Item target/release/bundle/nsis/*.exe) --draft --title "Nightglass for Windows $($env:GITHUB_REF_NAME -replace '^windows-v','')" --notes "Installer for Windows 10 and 11 (x64). Licences and third-party notices are installed in the licenses folder."
