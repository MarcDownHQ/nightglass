# Checks and builds the Windows app. Releases (a `v*` tag) run it from release.yml.
name: Windows

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [master]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci
      # Tauri's build script checks the bundled resources exist, so libmpv comes before any cargo command.
      - run: npm run fetch-libmpv
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - run: npm test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # With the update key (not on forks), the installer is also signed for the in-app updater (.sig next to it).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { npm run tauri build -- --config src-tauri/tauri.updater.conf.json }
          else { npm run tauri build }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: nightglass-windows-installer
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/nsis/*.exe.sig
