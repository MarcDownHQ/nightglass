# Checks and builds the Windows app. A `windows-v*` tag also attaches the installer to a draft release,
# which stays private until someone publishes it on GitHub.
name: Windows

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  push:
    branches: [master]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci
      # Tauri's build script checks the bundled resources exist, so libmpv comes before any cargo command.
      - run: npm run fetch-libmpv
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # With the update key (not on forks), the installer is also signed for the in-app updater (.sig next to it).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { npm run tauri build -- --config src-tauri/tauri.updater.conf.json }
          else { npm run tauri build }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: nightglass-windows-installer
          path: windows/target/release/bundle/nsis/*.exe
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "windows-v$version") { throw "tag $env:GITHUB_REF_NAME does not match version $version in tauri.conf.json" }
          $exe = Get-Item target/release/bundle/nsis/*-setup.exe
          # What the app's updater reads, at releases/latest/download/latest.json once the release is published.
          @{
            version = $version
            notes = "Nightglass for Windows $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM latest.json
          gh release create $env:GITHUB_REF_NAME $exe.FullName latest.json --draft --title "Nightglass for Windows $version" --notes "Installer for Windows 10 and 11 (x64). Licences and third-party notices are installed in the licenses folder. Installed copies offer this update from their title bar."
